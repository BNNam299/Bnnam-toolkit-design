schema_version: "1.1"
name: users-from-kickoff
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The run reads prd.md §2–4 (kickoff done) and docs/market evidence, then fills prd.md §5 only: 1–3 personas built from
  review / forum evidence and labelled GIẢ ĐỊNH (proto), jobs in "Khi … tôi muốn … để …" form, who is not a user, a 5-stage
  journey with break points, and the aha moment as an action with a step count. Because no one was interviewed, it gives the
  lead 5–7 questions to ask 1–2 people and names the post-launch number that would confirm or break each persona — no
  formal interview round or large survey. It stops and names product-plan as the next step.
